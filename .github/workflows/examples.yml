name: Executable tutorial examples
on: [push, pull_request]
permissions:
  contents: read
jobs:
  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: tutorial
      - uses: actions/checkout@v4
        with:
          repository: mini-lang/mini-lang
          path: interpreter
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m unittest tests.test_documentation -v
        working-directory: interpreter
        env:
          MINI_TUTORIAL_DIR: ../tutorial
